<section id="section-login" class="settings-section">
            <h2>自动登录相关设置</h2>
            <p class="section-desc">配置自动识图与填充。</p>
            <div class="card">
                <div class="toggle-group">
                    <div class="toggle-info">
                        <span class="label">悦读平台自动跳转</span>
                        <p class="hint-text" style="margin:4px 0 0;font-weight:400;">启用后，访问悦读平台时自动跳转到登录入口，提升效率。</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-spoc-redirect">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="toggle-group">
                    <div class="toggle-info">
                        <span class="label">自动填充</span>
                        <p class="hint-text" style="margin:4px 0 0;font-weight:400;">启用后，在统一认证及选课系统登录页自动填充学号密码。验证码需手动完成。</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="login-autofill">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </section>
