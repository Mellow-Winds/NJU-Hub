<!DOCTYPE html>
<html lang="zh-CN" data-nju-owned data-nju-material-page="extension">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑消息 · NJU-Hub</title>
    <link rel="stylesheet" href="../options/options.css">
    <link rel="stylesheet" href="../scripts/material-global.css">
    <link rel="stylesheet" href="message.css">
</head>
<body>
<main class="message-shell settings-section active">
    <header><a href="settings.html" target="_blank" rel="noopener">消息订阅设置 ↗</a><span>NJU-Hub</span></header>
    <section class="card">
        <h1>编辑消息</h1>
        <p class="delivery">发送到我的邮箱 <strong id="self-email">加载中…</strong></p>
        <p class="hint-text" id="source"></p>
        <form id="compose-form">
            <fieldset id="fields" disabled>
                <label class="message-field"><span>邮件主题</span><input id="subject" required maxlength="200"></label>
                <label class="message-field"><span>消息内容</span><textarea id="text" required maxlength="50000" rows="10"></textarea></label>
                <label class="message-field"><span>发送时间</span><input id="scheduled-at" type="datetime-local" aria-describedby="time-hint"></label>
                <p class="hint-text" id="time-hint">留空立即发送；预约时间按本机时区，限未来 30 天。</p>
                <div class="actions"><button id="send" class="btn-save" type="submit">发送到我的邮箱</button></div>
            </fieldset>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <a class="hint-text" href="https://resend.com/emails" target="_blank" rel="noopener noreferrer">在 Resend 查看投递和预约状态 ↗</a>
    </section>
</main>
<script src="../options/material-color-utils.js"></script>
<script src="../scripts/seasonal-background.js"></script>
<script src="../scripts/material-global.js"></script>
<script src="page.js"></script>
<script src="compose.js"></script>
</body>
</html>
